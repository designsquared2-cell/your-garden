<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2D10">
<meta name="description" content="Bed planner, tasks and watering for a Perth Hills garden">
<title>🌱 Garden</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="hdr">
  <div><div class="hdr-title">🌱 Garden</div><div class="hdr-sub" id="hdr-sub">Loading…</div></div>
  <div class="hdr-right">
    <button class="alert-pill" id="alert-pill" onclick="goToAlerts()">0 urgent</button>
    <button class="settings-btn" aria-label="Settings" onclick="openSettings()">⚙️</button>
  </div>
</header>
<main class="scroll">
  <section class="view on" id="view-beds">
    <div id="beds-summary"></div>
    <div class="bed-controls"><button class="sel-fab" id="sel-fab" onclick="toggleSelectMode()">✓ Select</button></div>
    <div id="beds-wrap"></div>
    <div class="legend">
      <div class="leg"><div class="leg-sq" style="background:#102A0C"></div>Seed</div>
      <div class="leg"><div class="leg-sq" style="background:#163A10"></div>Seedling</div>
      <div class="leg"><div class="leg-sq" style="background:#1A4A0E"></div>Growing</div>
      <div class="leg"><div class="leg-sq" style="background:#402800"></div>Ready ✨</div>
      <div class="leg"><div class="leg-sq" style="background:#3A1200"></div>Bolting ⚠️</div>
      <div class="leg"><div class="leg-sq" style="background:#1A1A18"></div>Finished</div>
    </div>
    <div class="beds-hint">Drag a plant to move it (on phones, press and hold first) · Tap Select to edit several at once</div>
  </section>
  <section class="view" id="view-jobs"><div id="jobs-content"></div></section>
  <section class="view" id="view-month"><div id="month-content"></div></section>
  <section class="view" id="view-plants"><div id="plants-content"></div></section>
  <section class="view" id="view-pests"><div id="pests-content"></div></section>
</main>
<nav class="nav" id="main-nav">
  <button class="nav-btn active" data-view="beds" onclick="setView('beds')"><span class="nav-icon">🌿</span>Beds</button>
  <button class="nav-btn" data-view="jobs" onclick="setView('jobs')"><span class="nav-icon">🐝<span class="nav-badge" id="jobs-badge" hidden>0</span></span>Jobs</button>
  <button class="nav-btn" data-view="month" onclick="setView('month')"><span class="nav-icon">📅</span>This Month</button>
  <button class="nav-btn" data-view="plants" onclick="setView('plants')"><span class="nav-icon">🌱</span>Plants</button>
  <button class="nav-btn" data-view="pests" onclick="setView('pests')"><span class="nav-icon">🐛</span>Pests</button>
</nav>
<div class="sel-bar" id="sel-bar">
  <div class="sel-count" id="sel-count">0 selected</div>
  <button class="sel-act" onclick="openMultiStatus()">Status ▾</button>
  <button class="sel-act danger" onclick="doMultiRemove()">🗑️ Remove</button>
  <button class="sel-done" onclick="exitSelectMode()">Done</button>
</div>
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sh-handle"></div><div id="sh-content"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="confetti"></div>

<!-- Plain scripts (no build step); order matters: data → state → UI → features → startup -->
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/weather.js"></script>
<script src="js/pests.js"></script>
<script src="js/tasks.js"></script>
<script src="js/month.js"></script>
<script src="js/plants-view.js"></script>
<script src="js/beds.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
