<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('gdn_theme')||'light';}catch(e){document.documentElement.dataset.theme='light';}</script>
<meta name="description" content="Plan your garden beds and learn what to do each week">
<title>🌱 Your Garden</title>
<meta name="apple-mobile-web-app-title" content="Your Garden">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=61">
</head>
<body>
<div id="splash" class="splash" onclick="endSplash()" aria-hidden="true">
  <svg class="sp-svg" viewBox="0 0 200 200" width="170" height="170">
    <path class="sp-ground" d="M62 162 Q100 158 138 162" pathLength="1"/>
    <g class="sp-wash"><path d="M101 112 C114 92 138 86 156 90 C144 108 122 118 101 112 Z"/><path d="M100 52 C92 38 78 32 66 34 C72 46 86 54 100 52 Z"/></g>
    <path class="sp-line sp-stem" d="M100 162 C99 142 96 124 101 104 C105 86 104 68 100 52" pathLength="1"/>
    <path class="sp-line sp-leaf1" d="M101 112 C114 92 138 86 156 90 C144 108 122 118 101 112" pathLength="1"/>
    <path class="sp-line sp-rib1" d="M103 110 Q128 98 150 91" pathLength="1"/>
    <path class="sp-line sp-leaf2" d="M100 52 C92 38 78 32 66 34 C72 46 86 54 100 52" pathLength="1"/>
  </svg>
  <div class="sp-title">Your Garden</div>
  <div class="sp-sub">your garden’s secret helper</div>
</div>

<header class="hdr">
  <div><div class="hdr-title">🌱 Your Garden</div><div class="hdr-sub" id="hdr-sub">Loading…</div></div>
  <div class="hdr-right">
    <button class="alert-pill" id="alert-pill" onclick="goToAlerts()">0 urgent</button>
    <button class="settings-btn" aria-label="Settings" onclick="openSettings()">⚙️</button>
  </div>
</header>
<main class="scroll">
  <section class="view on" id="view-beds">
    <div id="beds-summary"></div>
    <div class="bed-controls"><button class="sel-fab" id="sel-fab" onclick="toggleSelectMode()">✓ Select</button></div>
    <div id="beds-wrap"></div>
    <div class="legend">
      <div class="leg"><div class="leg-sq s-seed"></div>Seed</div>
      <div class="leg"><div class="leg-sq s-seedling"></div>Seedling</div>
      <div class="leg"><div class="leg-sq s-growing"></div>Growing</div>
      <div class="leg"><div class="leg-sq s-ready"></div>Ready ✨</div>
      <div class="leg"><div class="leg-sq s-bolting"></div>Bolting ⚠️</div>
      <div class="leg"><div class="leg-sq s-done"></div>Finished</div>
    </div>
    <div class="beds-hint" id="beds-hint">Drag a plant to move it (on phones, press and hold first) · Tap Select to edit several at once</div>
  </section>
  <section class="view" id="view-jobs"><div id="jobs-content"></div></section>
  <section class="view" id="view-harvest"><div id="harvest-content"></div></section>
  <section class="view" id="view-plants"><div id="plants-content"></div></section>
  <section class="view" id="view-pests"><div id="pests-content"></div></section>
</main>
<nav class="nav" id="main-nav">
  <button class="nav-btn active" data-view="beds" onclick="setView('beds')"><span class="nav-icon">🌿</span>Beds</button>
  <button class="nav-btn" data-view="jobs" onclick="setView('jobs')"><span class="nav-icon">🐝<span class="nav-badge" id="jobs-badge" hidden>0</span></span>Jobs</button>
  <button class="nav-btn" data-view="harvest" onclick="setView('harvest')"><span class="nav-icon">🧺</span>Harvest</button>
  <button class="nav-btn" data-view="plants" onclick="setView('plants')"><span class="nav-icon">🌱</span>Plants</button>
  <button class="nav-btn" data-view="pests" onclick="setView('pests')"><span class="nav-icon">🐛</span>Pests</button>
</nav>
<div class="sel-bar" id="sel-bar">
  <div class="sel-count" id="sel-count">0 selected</div>
  <button class="sel-act" onclick="openMultiStatus()">Status ▾</button>
  <button class="sel-act" onclick="openMultiDate()">📅 Date</button>
  <button class="sel-act danger" aria-label="Remove selected" title="Remove selected" onclick="doMultiRemove()">🗑️</button>
  <button class="sel-done" onclick="exitSelectMode()">Done</button>
</div>
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sh-handle"></div><div id="sh-content"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="confetti"></div>

<!-- Plain scripts (no build step); order matters: data → state → UI → features → startup -->
<script src="js/data.js?v=61"></script>
<script src="js/state.js?v=61"></script>
<script src="js/varieties.js?v=61"></script>
<script src="js/zones.js?v=61"></script>
<script src="js/ui.js?v=61"></script>
<script src="js/weather.js?v=61"></script>
<script src="js/pests.js?v=61"></script>
<script src="js/tasks.js?v=61"></script>
<script src="js/harvest.js?v=61"></script>
<script src="js/plants-view.js?v=61"></script>
<script src="js/behaviour.js?v=61"></script>
<script src="js/rotation.js?v=61"></script>
<script src="js/fruit.js?v=61"></script>
<script src="js/feeding.js?v=61"></script>
<script src="js/crops2.js?v=61"></script>
<script src="js/seasons.js?v=61"></script>
<script src="js/seeds.js?v=61"></script>
<script src="js/reminders.js?v=61"></script>
<script src="js/beds.js?v=61"></script>
<script src="js/settings.js?v=61"></script>
<script src="js/help.js?v=61"></script>
<script src="js/nudge-pick.js?v=61"></script>
<script src="js/notify.js?v=61"></script>
<script src="js/config.js?v=61"></script>
<script src="js/sync.js?v=61"></script>
<script src="js/main.js?v=61"></script>
</body>
</html>
