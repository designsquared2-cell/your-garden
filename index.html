<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('gdn_theme')||'light';}catch(e){document.documentElement.dataset.theme='light';}</script>
<meta name="description" content="Plan your garden beds and learn what to do each week">
<title>Your Garden</title>
<meta name="apple-mobile-web-app-title" content="Your Garden">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=63">
</head>
<body>
<div id="splash" class="splash" onclick="endSplash()" aria-hidden="true">
  <svg class="sp-svg" viewBox="0 0 200 200" width="170" height="170">
    <path class="sp-ground" d="M62 162 Q100 158 138 162" pathLength="1"/>
    <g class="sp-wash"><path d="M101 112 C114 92 138 86 156 90 C144 108 122 118 101 112 Z"/><path d="M100 52 C92 38 78 32 66 34 C72 46 86 54 100 52 Z"/></g>
    <path class="sp-line sp-stem" d="M100 162 C99 142 96 124 101 104 C105 86 104 68 100 52" pathLength="1"/>
    <path class="sp-line sp-leaf1" d="M101 112 C114 92 138 86 156 90 C144 108 122 118 101 112" pathLength="1"/>
    <path class="sp-line sp-rib1" d="M103 110 Q128 98 150 91" pathLength="1"/>
    <path class="sp-line sp-leaf2" d="M100 52 C92 38 78 32 66 34 C72 46 86 54 100 52" pathLength="1"/>
  </svg>
  <div class="sp-title">Your Garden</div>
  <div class="sp-sub">your garden’s secret helper</div>
</div>

<header class="hdr">
  <div><div class="hdr-title"><svg class="logo hdr-logo" viewBox="21 8 180 180" aria-hidden="true"><g class="lg-wash"><path d="M101 112 C114 92 138 86 156 90 C144 108 122 118 101 112 Z"/><path d="M100 52 C92 38 78 32 66 34 C72 46 86 54 100 52 Z"/></g><path class="lg-ground" d="M62 162 Q100 158 138 162"/><path class="lg-line" d="M100 162 C99 142 96 124 101 104 C105 86 104 68 100 52"/><path class="lg-line" d="M101 112 C114 92 138 86 156 90 C144 108 122 118 101 112"/><path class="lg-line lg-rib" d="M103 110 Q128 98 150 91"/><path class="lg-line" d="M100 52 C92 38 78 32 66 34 C72 46 86 54 100 52"/></svg>Your Garden</div><div class="hdr-sub" id="hdr-sub">Loading…</div></div>
  <div class="hdr-right">
    <button class="alert-pill" id="alert-pill" onclick="goToAlerts()">0 urgent</button>
    <button class="settings-btn" aria-label="Settings" onclick="openSettings()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M18 7h2M4 17h3M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/></svg></button>
  </div>
</header>
<main class="scroll">
  <section class="view on" id="view-beds">
    <div id="beds-summary"></div>
    <div class="bed-controls"><button class="sel-fab" id="sel-fab" onclick="toggleSelectMode()">✓ Select</button></div>
    <div id="beds-wrap"></div>
    <div class="legend">
      <div class="leg"><div class="leg-sq s-seed"></div>Seed</div>
      <div class="leg"><div class="leg-sq s-seedling"></div>Seedling</div>
      <div class="leg"><div class="leg-sq s-growing"></div>Growing</div>
      <div class="leg"><div class="leg-sq s-ready"></div>Ready ✨</div>
      <div class="leg"><div class="leg-sq s-bolting"></div>Bolting ⚠️</div>
      <div class="leg"><div class="leg-sq s-done"></div>Finished</div>
    </div>
    <div class="beds-hint" id="beds-hint">Drag a plant to move it (on phones, press and hold first) · Tap Select to edit several at once</div>
  </section>
  <section class="view" id="view-jobs"><div id="jobs-content"></div></section>
  <section class="view" id="view-harvest"><div id="harvest-content"></div></section>
  <section class="view" id="view-plants"><div id="plants-content"></div></section>
  <section class="view" id="view-pests"><div id="pests-content"></div></section>
</main>
<nav class="nav" id="main-nav">
  <button class="nav-btn active" data-view="beds" onclick="setView('beds')"><span class="nav-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14h18l-1.5 6h-15z"/><path d="M8 14c0-3 .5-5 0-7M8 10c1-1.6 2.6-2.2 4.2-2M16 14c0-2.5.4-4 0-6M16 10.5c-1-1.5-2.4-2-3.8-1.8"/></svg></span>Beds</button>
  <button class="nav-btn" data-view="jobs" onclick="setView('jobs')"><span class="nav-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M8.5 11.5l2 2 4-4M8.5 17h7"/></svg><span class="nav-badge" id="jobs-badge" hidden>0</span></span>Jobs</button>
  <button class="nav-btn" data-view="harvest" onclick="setView('harvest')"><span class="nav-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10h17l-1.7 8.3a2 2 0 0 1-2 1.7H7.2a2 2 0 0 1-2-1.7z"/><path d="M8 10l3-6M16 10l-3-6"/></svg></span>Harvest</button>
  <button class="nav-btn" data-view="plants" onclick="setView('plants')"><span class="nav-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c0-4-.6-7 .2-9.5.6-2 .4-4-.2-5.5"/><path d="M12.2 13c1.6-3 4.6-4 7.3-3.4-1.6 3-4.6 4.1-7.3 3.4z"/><path d="M12 6C10.8 4 8.8 3 6.3 3.3 7.3 5.5 9.4 6.5 12 6z"/></svg></span>Plants</button>
  <button class="nav-btn" data-view="pests" onclick="setView('pests')"><span class="nav-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="14" rx="6" ry="6.8"/><path d="M12 7.2V20.8M9.6 7.6 8 5M14.4 7.6 16 5M6.2 12H4M17.8 12H20M6.6 17.2 4.8 18.6M17.4 17.2l1.8 1.4"/></svg></span>Pests</button>
</nav>
<div class="sel-bar" id="sel-bar">
  <div class="sel-count" id="sel-count">0 selected</div>
  <button class="sel-act" onclick="openMultiStatus()">Status ▾</button>
  <button class="sel-act" onclick="openMultiDate()">📅 Date</button>
  <button class="sel-act danger" aria-label="Remove selected" title="Remove selected" onclick="doMultiRemove()">🗑️</button>
  <button class="sel-done" onclick="exitSelectMode()">Done</button>
</div>
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sh-handle"></div><div id="sh-content"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="confetti"></div>

<!-- Plain scripts (no build step); order matters: data → state → UI → features → startup -->
<script src="js/data.js?v=63"></script>

<script src="js/zones.js?v=63"></script>
<script src="js/ui.js?v=63"></script>
<script src="js/weather.js?v=63"></script>
<script src="js/pests.js?v=63"></script>
<script src="js/tasks.js?v=63"></script>

<script src="js/plants-view.js?v=63"></script>
<script src="js/behaviour.js?v=63"></script>
<script src="js/rotation.js?v=63"></script>
<script src="js/fruit.js?v=63"></script>
<script src="js/feeding.js?v=63"></script>
<script src="js/crops2.js?v=63"></script>
<script src="js/seasons.js?v=63"></script>
<script src="js/seeds.js?v=63"></script>
<script src="js/reminders.js?v=63"></script>
<script src="js/beds.js?v=63"></script>
<script src="js/settings.js?v=63"></script>
<script src="js/help.js?v=63"></script>
<script src="js/nudge-pick.js?v=63"></script>
<script src="js/notify.js?v=63"></script>
<script src="js/config.js?v=63"></script>
<script src="js/sync.js?v=63"></script>
<script src="js/main.js?v=63"></script>
</body>
</html>
